
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آرتین مادر خراب</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #100b1c;
  color: white;
  font-family: Tahoma, sans-serif;
  text-align: center;
}
.game {
  width: 90%;
  max-width: 450px;
  padding: 35px 20px;
  background: #21152f;
  border: 2px solid #ff3366;
  border-radius: 25px;
  box-shadow: 0 0 40px #ff336644;
}
h1 { color: #ff477e; }
.character {
  font-size: 110px;
  margin: 30px 0;
  user-select: none;
}
.shake {
  animation: shake .3s;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-20px) rotate(-10deg); }
  75% { transform: translateX(20px) rotate(10deg); }
}
button {
  padding: 18px 30px;
  background: #ff3366;
  border: none;
  border-radius: 15px;
  color: white;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 5px 25px #ff336677;
}
button:active { transform: scale(.95); }
.score { font-size: 25px; margin: 25px; }
</style>
</head>
<body>
<div class="game">
  <h1>آرتین مادر خراب</h1>
  <p>بازی طنز با آدمک خیالی</p>
  <div class="character" id="target">🤡</div>
  <div class="score">امتیاز: <span id="score">0</span></div>
  <button onclick="hit()">🥊 ضربه کارتونی!</button>
  <p id="message">آماده‌ای؟</p>
</div>
<script>
let score = 0;
function hit() {
  score++;
  document.getElementById("score").textContent = score;
  const target = document.getElementById("target");
  target.classList.remove("shake");
  void target.offsetWidth;
  target.classList.add("shake");
  const messages = [
    "💥 بوم!",
    "😂 چه ضربه‌ای!",
    "⚡ کمبو!",
    "🏆 امتیاز گرفتی!"
  ];
  document.getElementById("message").textContent =
    messages[Math.floor(Math.random()*messages.length)];
}
</script>
</body>
</html>
